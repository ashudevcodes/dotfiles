set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",${TERM}:RGB"
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000

unbind C-b
set -g prefix C-space
bind C-space send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

set -g mouse on
set -g status-keys vi
setw -g mode-keys vi
set -s set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -sel clip -i || xsel -bi"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy || xclip -sel clip -i || xsel -bi"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-style bg=black,fg=white
set -g status-right ''

set -as terminal-features ',xterm*:Ss=\E[%p1%d q:Se=\E[2 q'
