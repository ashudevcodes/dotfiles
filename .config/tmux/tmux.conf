set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",${TERM}:RGB"
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000
set -as terminal-features ',xterm*:Ss=\E[%p1%d q:Se=\E[2 q'

unbind C-b
set -g prefix C-j
bind C-space send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

set -g mouse on
set -g status-keys vi
setw -g mode-keys vi
set -s set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -sel clip -i || xsel -bi"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy || xclip -sel clip -i || xsel -bi"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-position bottom
set -g status-interval 1
set -g status-style "fg=#a9b1d6"
set-option -g status-style bg=default
set -g status-left-length 80
set -g status-right-length 150

set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#565f89"

set -g message-style "bg=#364a82,fg=#c0caf5"
set -g message-command-style "bg=#364a82,fg=#c0caf5"

set -g status-left "\
#[bg=#7aa2f7,fg=#1a1b26,bold] #I \
#[bg=#1a1b26,fg=#7aa2f7] "

set -g status-right "\
#{?pane_mode,󰆏 }\
#[bg=#364a82,fg=#7aa2f7,bold]"

set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#364a82,fg=#7aa2f7,bold] #I:#W#{?window_zoomed_flag, 󰁌,} "
set -g window-status-separator ""

