{
  animations = (
# Global default (keeps your normal animations)
# -------------------------------------------------
	{
	  triggers = ["open", "hide"]
	  opacity = {
		curve    = "cubic-bezier(0.25,0.1,0.25,1)"
		duration = 0.20
		start    = 0
		end      = "window-raw-opacity"
	  }
	  offset-x = 0
	  offset-y = 0
	  scale-x  = 1
	  scale-y  = 1
	},

# Normal OPEN animation (used for most windows)
# -------------------------------------------------
    {
      triggers = ["open"]
      opacity = {
        curve    = "cubic-bezier(0.25,0.1,0.25,1)"
        duration = 0.20
        start    = 0
        end      = "window-raw-opacity"
      }
      blur-opacity = "opacity"
      offset-x = {
        curve    = "cubic-bezier(0.25,0.1,0.25,1)"
        duration = 0.20
        start    = "-window-width"
        end      = 0
      }
      offset-y = 0
      scale-x = {
        curve    = "cubic-bezier(0.25,0.1,0.25,1)"
        duration = 0.20
        start    = 0.9
        end      = 1
      }
      scale-y = "scale-x"
    },

# CLOSE animation
# -------------------------------------------------
    {
      triggers = ["close"]
      opacity = {
        curve    = "linear"
        duration = 0.03
        start    = "window-raw-opacity-before"
        end      = 0
      }
      scale-x = {
        curve    = "linear"
        duration = 0.03
        start    = 1
        end      = 0
      }
      scale-y = "scale-x"
    },

# SHOW (popup‑like) animation
# -------------------------------------------------
    {
      triggers = ["show"]
      opacity = {
        curve    = "cubic-bezier(0.2,0.8,0.2,1)"
        duration = 0.22
        start    = 0
        end      = "window-raw-opacity"
      }
      blur-opacity = "opacity"
      offset-x = 0
      offset-y = {
        curve    = "cubic-bezier(0.2,0.8,0.2,1)"
        duration = 0.22
        start    = 8
        end      = 0
      }
      scale-x = {
        curve    = "cubic-bezier(0.2,0.8,0.2,1)"
        duration = 0.22
        start    = 0.9
        end      = 1
      }
      scale-y = "scale-x"
    },

# HIDE animation
# -------------------------------------------------
    {
      triggers = ["hide"]
      opacity = {
        curve    = "linear"
        duration = 0.03
        start    = "window-raw-opacity-before"
        end      = 0
      }
      scale-x = {
        curve    = "linear"
        duration = 0.03
        start    = 1
        end      = 0
      }
      scale-y = "scale-x"
    },

# Geometry (resize/move) animation
# -------------------------------------------------
    {
      triggers = ["geometry"]
      scale-x = {
        curve    = "cubic-bezier(0,0,0,1.28)"
        duration = 0.22
        start    = "window-width-before / window-width"
        end      = 1
      }
      scale-y = {
        curve    = "cubic-bezier(0,0,0,1.28)"
        duration = 0.22
        start    = "window-height-before / window-height"
        end      = 1
      }
      offset-x = {
        curve    = "cubic-bezier(0,0,0,1.28)"
        duration = 0.22
        start    = "window-x-before - window-x"
        end      = 0
      }
      offset-y = {
        curve    = "cubic-bezier(0,0,0,1.28)"
        duration = 0.22
        start    = "window-y-before - window-y"
        end      = 0
      }
    } 
  )
}
