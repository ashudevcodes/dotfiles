animations = (
    {
      triggers = ["open"];
      scale-x = {
        curve = "cubic-bezier(1,0,0.2,1.2)";
        duration = 0.3;
        start = 0; 
        end = 1;
      };
      scale-y = "scale-x";

      offset-x = 0;
      offset-y = 0;
      
    },

    {
      triggers = ["show"];
      opacity = {
        curve = "linear";
        duration = 0.2;
        start = 0;
        end = 1;
      };
      offset-x = {
        curve = "cubic-bezier(0,0.6,0,1.2);"; 
        duration = 0.3;
        start = -1000;
        end = 1;
      };
      scale-x = 1;
      scale-y = 1;
    },

	{
      triggers = ["geometry"];
      scale-x = {
        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
        duration = 0.4;
        start = "window-width-before / window-width";
        end = 1;
      };
      scale-y = {
        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
        duration = 0.4;
        start = "window-height-before / window-height";
        end = 1;
      };
      offset-x = {
        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
        duration = 0.4;
        start = "window-x-before - window-x";
        end = 0;
      };
      offset-y = {
        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
        duration = 0.4;
        start = "window-y-before - window-y";
        end = 0;
      };
    },
  )
