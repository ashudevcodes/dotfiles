$noto_font = Noto Serif Ethiopic, Bold
$sf_pro_font = SF Pro Rounded, Black

background {
	path = ~/assets/adventure_time.png
    blur_passes = 1
    blur_size = 1
    zindex = 0
}

# Weather
label {
  text = cmd[update:1000] ~/.config/hypr/scripts/weather_cache.sh
  color = rgba(255, 255, 255, 0.8)
  font_size = 10
  font_family = JetBrainsMonoNerdFont Bold
  position = 200, -200
  halign = left
  valign = top
}

# Week
label {
	shadow_size = 1
	shadow_passes = 1
	shadow_color = rgb(0,0,0)
	shadow_boost = 0.590
  text = cmd[update:0] echo "$(date +"%A")"
  color = rgba(255, 255, 255, 0.8)
  font_size = 32
  font_family = $noto_font
  position = 40, -50
  halign = left
  valign = top
}

# Date
label {
	shadow_size = 1
	shadow_passes = 1
	shadow_color = rgb(0,0,0)
	shadow_boost = 0.590
  text = cmd[update:0] echo "$(date +"%d")"
  color = rgba(255, 107, 107, 1.0)
  font_size = 16
  font_family = $sf_pro_font
  position = 40, -100
  halign = left
  valign = top
}

# Month
label {
	shadow_size = 1
	shadow_passes = 1
	shadow_color = rgb(0,0,0)
	shadow_boost = 0.590
  text = cmd[update:0] echo "$(date +"%B")"
  color = rgba(255, 255, 255, 0.8)
  font_size = 16
  font_family = $sf_pro_font
  position = 70, -100
  halign = left
  valign = top
}

# Time hours
label {
	shadow_size = 1
	shadow_passes = 1
	shadow_color = rgb(0,0,0)
	shadow_boost = 0.590
  text = cmd[update:1000] echo -e "$(date +"%H")"
  color = rgb(181, 64, 31)
  font_size = 140
  font_family = $noto_font
  position = -15, 180
  halign = center
  valign = center
}

# Time minutes
label {
	shadow_size = 1
	shadow_passes = 1
	shadow_color = rgb(0,0,0)
	shadow_boost = 0.590
  text = cmd[update:1000] echo -e "$(date +"%M")"
  text = cmd[update:1000] echo -e "$(date +"%M")"
  color = rgb(232, 212, 168)
  font_size = 120
  font_family = $noto_font
  position = 15, 45
  halign = center
  valign = center
}

# Password fild
input-field {
	size = 100, 43
	outline_thickness = 1
	outer_color = rgba(255, 255, 255, 0.6) rgba(1, 1, 1, 0.3) 240deg
	inner_color = rgb(199, 140, 80)
	font_color = rgb(74, 46, 30)
	fade_on_empty = false
	rounding = 18
	dots_size = 0.15
	dots_spacing = 0.35
	dots_center = true
	check_color = rgba(80, 80, 80, 1) rgba(0, 0, 0, 0) 120deg
	placeholder_text = <span foreground="##4A2E1E90">   Password </span>
	hide_input = false
	font_family = Adwaita Sans, Bold
	position = 380, -250
	halign = center
	valign = center
	zindex = 1
	check_text = Authenticating...
}
