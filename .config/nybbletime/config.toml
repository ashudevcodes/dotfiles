[position]
anchor = "top-right"
margin_top = 24
margin_right = 24
margin_bottom = 24
margin_left = 0

[size]
dot_radius = 8
dot_gap = 8
col_gap = 8
group_gap = 8
padding = 30
corner_radius = 34

[colors]
bg = "#000000"
bg_opacity = 0.1
border_opacity = 0.09
dot_on = "#C0CAF0"
