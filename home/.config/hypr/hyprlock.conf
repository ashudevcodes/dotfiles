# ==========================================================
# EDITORIAL × LIQUID GLASS — OTTER COAST LAYOUT (compact + extras)
# Hyprlock v0.9.7
# Physical: 1920x1080  (all positions/sizes below are physical px)
# Scale: 1.2
# Logical: 1600x900
# Most widgets: center / center. Greeting is left-aligned,
# now-playing is right-aligned (see halign on those).
#
# Layout: date top-left, user + battery top-right, clock in the sky,
# greeting under the clock, password field under the center otter,
# now-playing text bottom-right (only shows while music plays).
# ==========================================================

# FONTS

$noto_font = Noto Serif Ethiopic
$sf_pro_font = SF Pro Rounded
$icon_font = Material Symbols Rounded


# ==========================================================
# GENERAL
# ==========================================================

general {
  hide_cursor = false
}


# ==========================================================
# ANIMATIONS
# ==========================================================

animations {
    enabled = true

    bezier = linear, 1, 1, 0, 0

    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}


# ==========================================================
# DATE GLASS PANEL  (top-left)
# ==========================================================

/-shape {
    size = 415, 145

    color = rgba(15, 29, 34, 0.50)
    rounding = 39

    border_size = 1
    border_color = rgba(190, 222, 230, 0.75) rgba(70, 110, 122, 0.20) 120deg

    shadow_size = 14
    shadow_passes = 2
    shadow_color = rgba(10, 15, 13, 0.5)
    shadow_boost = 0.7

    position = -667, 357
    halign = center
    valign = center

    zindex = 1
}


# WEEKDAY

/-label {
    text = cmd[update:60000] date +"%A"

    color = rgba(217, 228, 231, 0.95)

    font_size = 23
    font_family = $noto_font

    shadow_size = 1
    shadow_passes = 2
    shadow_color = rgb(10, 15, 13)
    shadow_boost = 0.65

    position = 10, 10
    halign = left
    valign = left

    zindex = 2
}


# DAY

/-label {
    text = cmd[update:60000] date +"%d"

    color = rgb(152, 168, 98)

    font_size = 22
    font_family = $sf_pro_font 
    position = -769, 324
    halign = center
    valign = center

    zindex = 2
}


# DIVIDER

/-shape {
    size = 2, 29

    color = rgba(217, 228, 231, 0.45)
    rounding = 1

    position = -751, 322
    halign = center
    valign = center

    zindex = 2
}


# MONTH

/-label {
    text = cmd[update:60000] date +"%B"

    color = rgba(217, 228, 231, 0.90)

    font_size = 16
    font_family = $sf_pro_font 

    position = -698, 323
    halign = center
    valign = center

    zindex = 2
}


# ==========================================================
# USER + BATTERY GLASS PANEL  (top-right, widened to 340)
# Right edge stays at the same spot; it grew to the left.
# ==========================================================

/-shape {
    size = 134, 53

    color = rgba(15, 29, 34, 0.50)
    rounding = 37

    border_size = 1
    border_color = rgba(190, 222, 230, 0.65) rgba(70, 110, 122, 0.20) 120deg

    position = -10, -10
    halign = right
    valign = top

    zindex = 1
}

# BATTERY ICON  (command prints the icon name; bolt while charging)

/-label {
    text = cmd[update:30000] ls /sys/class/power_supply/BAT* >/dev/null 2>&1 && (grep -qs Charging /sys/class/power_supply/BAT*/status && echo battery_android_full || echo battery_android_4)

    color = rgba(217, 228, 231, 0.95)

    font_size = 30
    font_family = $icon_font

    position = -30, -13
    halign = right
    valign = top

    zindex = 2
}


# BATTERY PERCENT

/-label {
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 | xargs -r -I{} echo {}%

    color = rgba(217, 228, 231, 0.90)

    font_size = 16
    font_family = $sf_pro_font

    position = -77, -24
    halign = right
    valign = top

    zindex = 2
}


# ==========================================================
# CLOCK  (centered in the sky, level with the date panel)
# ==========================================================

/-label {
    text = <span weight="heavy">$TIME</span>

    color = rgba(140, 178, 184, 0.92)

    font_size = 145
    font_family = $sf_pro_font

    shadow_size = 4
    shadow_passes = 3
    shadow_color = rgba(8, 20, 25, 0.5)
    shadow_boost = 0.7

    position = 0, 355
    halign = center
    valign = center

    zindex = 2
}


# ==========================================================
# ACCENT RULE + DOT  (under the clock, starts at its left edge)
# ==========================================================

/-shape {
    size = 260, 2

    color = rgba(0, 0, 0, 0)
    rounding = 1

    border_size = 1
    border_color = rgba(170, 212, 218, 0.85) rgba(170, 212, 218, 0.0) 0deg

    position = -150, 248
    halign = center
    valign = center

    zindex = 1
}

/-shape {
    size = 9, 9

    color = rgba(190, 228, 234, 0.95)
    rounding = -1

    shadow_size = 6
    shadow_passes = 2
    shadow_color = rgba(150, 210, 220, 0.6)
    shadow_boost = 0.8

    position = -280, 248
    halign = center
    valign = center

    zindex = 2
}


# GREETING  (left-aligned so it starts under the dot)
# Picks the phrase from the hour; $USER is filled in by hyprlock.

/-label {
    text = cmd[update:600000] echo "<i>$(case $(date +%H) in (0[0-4]) echo Still up;; (0[5-9]|1[01]) echo Good morning;; (1[2-7]) echo Good afternoon;; (*) echo Good evening;; esac), $USER</i>"

    color = rgba(217, 228, 231, 0.82)

    font_size = 24
    font_family = $noto_font

    shadow_size = 2
    shadow_passes = 2
    shadow_color = rgba(8, 20, 25, 0.6)
    shadow_boost = 0.8

    position = 676, 218
    halign = left
    valign = center

    zindex = 2
}


# ==========================================================
# PASSWORD GLASS  (bottom-center, under the otter)
# ==========================================================

input-field {
    size = 200, 80

    outline_thickness = 2

    outer_color = rgba(190, 222, 230, 0.75) rgba(70, 110, 122, 0.25) 120deg

    inner_color = rgba(15, 29, 34, 0.55)

    font_color = rgba(217, 228, 231, 0.95)

    fade_on_empty = false

    rounding = 52

    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    check_color = rgba(127, 140, 83, 0.8) rgba(48, 83, 94, 0.8) 120deg

    fail_color = rgba(190, 85, 85, 0.9)

    placeholder_text = Enter password
    hide_input = false

    font_family = $sf_pro_font

    position = 0, 0
    halign = center
    valign = center

    zindex = 3

    # the joke: keeps the real PAM reason, adds the otters
    fail_text = <span font_family="SF Pro Rounded" weight="heavy" foreground="##D9E4E7B3"><i>$FAIL<b>($ATTEMPTS)</b></i></span>

    check_text = <span font_family="SF Pro Rounded" weight="heavy" foreground="##D9E4E7B3">Authenticating...</span>
}


# ==========================================================
# NOW PLAYING  (bottom-right, right edge lines up with the user pill)
# Text only, so nothing is left on screen when music isn't playing.
# Needs playerctl. Long titles are cut with "..." and & < are escaped
# so pango markup doesn't choke on them.
# ==========================================================

# ALBUM ARTWORK

/-image {
    path = playerctl metadata mpris:artUrl 2>/dev/null | sed 's#^file://##'

    size = 112
    rounding = 17

    border_color = rgba(190, 222, 230, 0.65) rgba(70, 110, 122, 0.20) 120deg

    reload_time = 2
    reload_cmd = playerctl metadata mpris:artUrl 2>/dev/null | sed 's#^file://##'

    position = -10, -468
    halign = right
    valign = center

    zindex = 2
}

# TITLE

label {
    text = cmd[update:2000] playerctl metadata title 2>/dev/null | sed -E 's/^(.{38}).+/\1.../; s/&/\&amp;/g; s/</\&lt;/g'

    color = rgba(217, 228, 231, 0.95)

    font_size = 22
    font_family = $sf_pro_font
    text_align = right

    shadow_size = 2
    shadow_passes = 2
    shadow_color = rgba(8, 20, 25, 0.7)
    shadow_boost = 0.9

    position = -40, -435
    halign = right
    valign = center

    zindex = 2
}


# ARTIST

label {
    text = cmd[update:2000] playerctl metadata artist 2>/dev/null | sed -E 's/^(.{38}).+/\1.../; s/&/\&amp;/g; s/</\&lt;/g'

    color = rgba(190, 222, 230, 0.80)

    font_size = 17
    font_family = $sf_pro_font
    text_align = right

    shadow_size = 2
    shadow_passes = 2
    shadow_color = rgba(8, 20, 25, 0.7)
    shadow_boost = 0.9

    position = -40, -467
    halign = right
    valign = center

    zindex = 2
}

/-label {
    text = cmd[update:2000] playerctl metadata mpris:length 2>/dev/null | awk '{ s=int($1/1000000); printf "%d:%02d", int(s/60), s%60 }'

    color = rgba(190, 222, 230, 0.60)

    font_size = 15
    font_family = $sf_pro_font
    text_align = right

    shadow_size = 2
    shadow_passes = 2
    shadow_color = rgba(8, 20, 25, 0.7)
    shadow_boost = 0.9

    position = -140, -500
    halign = right
    valign = center

    zindex = 2
}
